<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Linacre LLM Hub — Verified AI Benchmarks, Model Pricing, Local AI Explorer, Open-Source AI Projects & Hardware Compatibility Workstation." />
  <meta name="theme-color" content="#0a0a12" />
  <title>Linacre LLM Hub — Verified AI Intelligence Workstation</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary Navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">L4</div>
        <div>
          <h1 class="brand-title">LINACRE</h1>
          <p class="brand-sub">LLM HUB v5.0</p>
        </div>
      </div>

      <nav class="nav-list" role="tablist" aria-label="Workspace Sections">
        <button class="nav-item active" data-view="dashboard" role="tab" aria-selected="true">Dashboard</button>
        <button class="nav-item" data-view="leaderboards" role="tab" aria-selected="false">Global Leaderboards</button>
        <button class="nav-item" data-view="compare" role="tab" aria-selected="false">Model Comparison</button>
        <button class="nav-item" data-view="hardware" role="tab" aria-selected="false">Hardware Calculator</button>
        <button class="nav-item" data-view="local" role="tab" aria-selected="false">Local AI Explorer</button>
        <button class="nav-item" data-view="pricing" role="tab" aria-selected="false">Pricing Intelligence</button>
        <button class="nav-item" data-view="trending" role="tab" aria-selected="false">Open-Source AI</button>
        <button class="nav-item" data-view="releases" role="tab" aria-selected="false">AI News &amp; Releases</button>
        <button class="nav-item" data-view="workspace" role="tab" aria-selected="false">Personal Workspace</button>
        <button class="nav-item" data-view="sources" role="tab" aria-selected="false">Sources &amp; Transparency</button>
      </nav>

      <div class="sidebar-footer">
        <div class="integrity-pill">
          <span class="dot" aria-hidden="true"></span>
          <span>Verified Data Only</span>
        </div>
        <p class="sidebar-note">No synthetic scores. Missing data is always labeled honestly.</p>
      </div>
    </aside>

    <div class="content-area">
      <header class="topbar">
        <div class="topbar-left">
          <button id="mobileMenuBtn" class="icon-btn mobile-only" aria-label="Toggle navigation menu">☰</button>
          <div>
            <h2 id="viewTitle" class="view-title">AI Intelligence Dashboard</h2>
            <p id="viewSubtitle" class="view-subtitle">Verified data from official APIs with full provenance</p>
          </div>
        </div>
        <div class="topbar-right">
          <span id="lastUpdatedBadge" class="meta-badge">Loading data…</span>
        </div>
      </header>

      <main id="main-content" class="main-content" tabindex="-1">
        <div id="viewContainer" class="view-container">
          <p class="loading-text">Loading verified datasets…</p>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
